# Automated dependency bumps. Pairs with the committed bun.lock (supply-chain
# pinning) and the CI `bun audit` gate: Dependabot proposes the refresh PRs,
# CI proves them safe. See docs/specs/security-audit-1.0.md (2026-08-02).
version: 2
updates:
  # Bun workspace (root bun.lock covers _shared, packages/*, frontend).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Majors were parked here during the 1.0.x line and taken as a batch in
    # v1.1.0 (#124). Re-add this block if majors start arriving faster than
    # they can be validated:
    #   ignore:
    #     - dependency-name: "*"
    #       update-types: ["version-update:semver-major"]
    ignore:
      # @types/node tracks the RUNTIME FLOOR (Node 24: engines, CI, release
      # workflow, runtime-floor.test.ts), not the newest Node. Typing against a
      # newer major lets tsc accept APIs the supported floor does not have.
      # Move this together with the floor. Declined in #294.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # onnxruntime-node is the native runtime @huggingface/transformers loads,
      # and transformers pins it exactly. Raising our optional dependency past
      # that pin installs a second copy that nothing runs (#300). Let it move
      # only when transformers moves its pin.
      - dependency-name: "onnxruntime-node"
      # The Cerefox Local image pins the same transformers version in
      # docker/local/runtime, and a test fails when the two lockfiles differ
      # (#300). Moving it changes the vectors Local stores hold, so it is a
      # deliberate, measured edit (docs/plans/iteration-54-local-transformers-4.md),
      # not part of a grouped bump.
      - dependency-name: "@huggingface/transformers"

  # GitHub Actions — understands our SHA pins and bumps SHA + version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
