# Build + publish the Cerefox WEB image (`cerefox web` against a Supabase
# backend, #346) to GitHub Container Registry. The all-in-one image with its own
# database is local-image.yml.
#
# Manual dispatch only, like local-image.yml: `cut_release.ts --docker-publish`
# dispatches both. After the FIRST publish, set the package visibility to Public
# in its GitHub package settings (one-time). Publishes:
#   ghcr.io/<owner>/cerefox-web:<tag>   (+ :latest when publish_latest=true)

name: Publish web image (ghcr.io)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.20.0 or dev)"
        required: true
        default: dev
      publish_latest:
        description: "Also tag :latest (use for a stable release)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      # A release tag (v…) builds THAT tag's tree, whichever ref the dispatch
      # ran on; anything else (dev) builds the dispatched ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ startsWith(github.event.inputs.tag, 'v') && github.event.inputs.tag || '' }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags/labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerefox-web
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}
            type=raw,value=latest,enable=${{ github.event.inputs.publish_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Cerefox Web
            org.opencontainers.image.description=The Cerefox server and web UI for a Supabase-backed Cerefox, to run on a LAN host or a cloud service. Requires CEREFOX_API_KEY. Guide: https://github.com/fstamatelopoulos/cerefox/blob/main/docs/guides/setup-lan.md
            org.opencontainers.image.documentation=https://github.com/fstamatelopoulos/cerefox/blob/main/docs/guides/setup-lan.md

      # Gate the push on the smoke test (the gate, the SPA under it, the
      # healthcheck, the keyless refusal). amd64 only: native on this runner.
      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: cerefox-web-smoke:ci
          provenance: false
          cache-from: type=gha,scope=web

      - name: Web image smoke test
        run: CEREFOX_SMOKE_IMAGE=cerefox-web-smoke:ci sh docker/web/smoke.sh

      - name: Build + push (multi-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
