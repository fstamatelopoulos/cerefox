[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerefox"
dynamic = ["version"]
description = "Personal second brain: cloud knowledge backend with MCP access for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# Frozen at v0.9.0: the Python side is now only the MCP server (a repo-clone
# fallback). The web app (FastAPI/uvicorn) was retired to a husk in v0.9.0, so
# its deps are gone. These deps support `cerefox mcp` + ingestion/search.
dependencies = [
    "supabase>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "mcp>=1.0.0",
]

[project.scripts]
cerefox = "cerefox.cli:cli"

# v0.9.0: pytest retired as a test runner — the test suite is `bun test`
# (TS). The Python side is frozen/unmaintained; only ruff is kept for linting.
[dependency-groups]
dev = [
    "ruff>=0.4.0",
]

[tool.hatch.version]
# Single source of truth: the plain-text VERSION file at the repo root.
# Bumped (and tagged) by `bun scripts/cut_release.ts`.
path = "VERSION"
pattern = "^(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/cerefox"]
# Files that live outside src/cerefox/ but need to ship inside the wheel.
# Bundled paths show up under cerefox/ at runtime and are read via
# importlib.resources by the consuming modules.
#
#   VERSION              → consumed by src/cerefox/__init__.py for __version__
#   frontend/dist        → consumed by src/cerefox/api/app.py for the SPA mount
#   docs/guides/         → consumed by docs surfacing (cerefox docs, /app/help)
#   AGENT_GUIDE.md       ↗
#   AGENT_QUICK_REFERENCE.md ↗
#   README.md            → bundled so users can read "what is this" without GitHub
[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "cerefox/_VERSION"
"frontend/dist" = "cerefox/_frontend_dist"
"docs/guides" = "cerefox/_docs/guides"
"AGENT_GUIDE.md" = "cerefox/_docs/AGENT_GUIDE.md"
"AGENT_QUICK_REFERENCE.md" = "cerefox/_docs/AGENT_QUICK_REFERENCE.md"
"README.md" = "cerefox/_docs/README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# pytest config removed in v0.9.0 — the test suite is `bun test` (TypeScript).
# See docs/specs/polish-and-distribution-design.md §19 and CLAUDE.md.
