[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerefox"
dynamic = ["version"]
description = "Personal second brain: cloud knowledge backend with MCP access for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# No optional deps for embeddings — CloudEmbedder uses httpx (already a core dep).
# File format converters are still optional:
pdf = ["pypdf>=4.0.0"]
docx = ["python-docx>=1.1.0"]
converters = ["pypdf>=4.0.0", "python-docx>=1.1.0"]

[project.scripts]
cerefox = "cerefox.cli:cli"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-playwright>=0.7.2",
    "ruff>=0.4.0",
]

[tool.hatch.version]
# Single source of truth: the plain-text VERSION file at the repo root.
# Bumped (and tagged) by `bun scripts/cut_release.ts`.
path = "VERSION"
pattern = "^(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/cerefox"]
# Files that live outside src/cerefox/ but need to ship inside the wheel.
# Bundled paths show up under cerefox/ at runtime and are read via
# importlib.resources by the consuming modules.
#
#   VERSION              → consumed by src/cerefox/__init__.py for __version__
#   frontend/dist        → consumed by src/cerefox/api/app.py for the SPA mount
#   docs/guides/         → consumed by docs surfacing (cerefox docs, /app/help)
#   AGENT_GUIDE.md       ↗
#   AGENT_QUICK_REFERENCE.md ↗
#   README.md            → bundled so users can read "what is this" without GitHub
[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "cerefox/_VERSION"
"frontend/dist" = "cerefox/_frontend_dist"
"docs/guides" = "cerefox/_docs/guides"
"AGENT_GUIDE.md" = "cerefox/_docs/AGENT_GUIDE.md"
"AGENT_QUICK_REFERENCE.md" = "cerefox/_docs/AGENT_QUICK_REFERENCE.md"
"README.md" = "cerefox/_docs/README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a live Supabase/Postgres connection (skipped by default)",
    "e2e: end-to-end tests against a live Supabase instance (skipped by default, run with -m e2e)",
    "ui: UI end-to-end tests via Playwright (skipped by default, run with -m ui)",
]
addopts = "-m 'not integration and not e2e and not ui'"
