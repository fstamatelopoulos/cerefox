version: "3.9"

# ── Cerefox local stack ────────────────────────────────────────────────────────
# ⚠ UNTESTED end-to-end. The `cerefox` service builds
# the TypeScript web image (Dockerfile → `cerefox web`); the former Python/FastAPI
# image was retired in v0.9.
#
# Runs Postgres+pgvector locally. For cloud deployment (Supabase), only the
# `cerefox` service is needed — point it at your Supabase credentials.
#
# One-time schema deploy against the local DB is a separate step (NOT done by the
# image): `cerefox server deploy`, or `bun scripts/db_deploy.ts` from a clone.
#
# Usage:
#   docker compose up -d              # start everything
#   docker compose up -d postgres     # start only the database
#   docker compose logs -f cerefox   # watch the web UI logs
#
# Ports are published to 127.0.0.1 only. Cerefox has no authentication on
# /api/v1 or on this Postgres, so exposing either beyond the host is a
# decision to make deliberately, not a default to inherit. The supported local
# install (docker/local/) does the same thing and offers CEREFOX_LOCAL_BIND for
# the LAN case.

services:

  # ── Postgres with pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cerefox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cerefox
      POSTGRES_PASSWORD: cerefox
      POSTGRES_DB: cerefox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback-only, matching docker/local/compose.yml and the installer
      # (#227). Docker's short "5432:5432" form binds the HOST's 0.0.0.0, so
      # this published a database with in-file credentials to the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerefox -d cerefox"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cerefox web UI ─────────────────────────────────────────────────────────
  cerefox:
    build: .
    container_name: cerefox-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Supabase API credentials (required for MCP agent access).
      # Leave blank to use the local Postgres directly via DATABASE_URL.
      CEREFOX_SUPABASE_URL: ${CEREFOX_SUPABASE_URL:-}
      CEREFOX_SUPABASE_KEY: ${CEREFOX_SUPABASE_KEY:-}

      # Direct Postgres URL — used by `cerefox server deploy` / db_deploy.ts.
      CEREFOX_DATABASE_URL: postgresql://cerefox:cerefox@postgres:5432/cerefox

      # Embedding model (cloud API, requires OPENAI_API_KEY).
      CEREFOX_EMBEDDER: ${CEREFOX_EMBEDDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Chunking and retrieval settings.
      CEREFOX_MAX_CHUNK_CHARS: ${CEREFOX_MAX_CHUNK_CHARS:-4000}
      CEREFOX_MAX_RESPONSE_BYTES: ${CEREFOX_MAX_RESPONSE_BYTES:-65000}

      # Backup directory (mounted as a volume below).
      CEREFOX_BACKUP_DIR: /data/backups
    volumes:
      - cerefox_data:/data
    ports:
      # Loopback-only (#227). /api/v1 has no authentication, so the short
      # form published an unauthenticated write API on every interface.
      # `--host 0.0.0.0` in the Dockerfile CMD is correct and stays: the
      # container's own loopback is not the host's, so the BIND must be broad
      # and the PUBLISH is what should be narrow.
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
  cerefox_data:
